services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-nta}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nta_pass}
      POSTGRES_DB: ${DB_NAME:-nta}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
volumes:
  pgdata: